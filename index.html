<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koustab Chowdhury - Portfolio</title>
    <style>
        body {
            background-color: #0b192c;
            color: #f5f5f5;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .portfolio-card {
            max-width: 500px;
            width: 100%;
            background-color: #1e3e62;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #ffb703;
        }
        .role {
            font-family: sans-serif;
            font-size: 0.95rem;
            color: #90e0ef;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            line-height: 1.6;
            color: #e0fbfc;
            font-size: 1rem;
        }
        .links {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .link-btn {
            border: 1px solid #90e0ef;
            padding: 10px 18px;
            color: #f5f5f5;
            text-decoration: none;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .link-btn:hover {
            background-color: #90e0ef;
            color: #0b192c;
        }
    </style>
</head>
<body>
    <div class="portfolio-card">
        <h1>Koustab Chowdhury</h1>
        <div class="role">University Student • Brainware University</div>
        <p>Student focusing on management, analytics, and operational systems, building structured projects and practical experience.</p>
        
        <div class="links">
            <a href="mailto:your-email@gmail.com" class="link-btn">Email Me</a>
            <a href="https://linkedin.com" target="_blank" class="link-btn">LinkedIn</a>
        </div>
    </div>
</body>
</html>
